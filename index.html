<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição no Evento</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Inscrição no Evento</h1>
        <p>Preencha seus dados e selecione seu estado e sua cidade para participar.</p>

        <form id="formInscricao" autocomplete="off">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" autocomplete="off" placeholder="Digite seu nome completo" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" autocomplete="off" placeholder="seuemail@exemplo.com" required>

            <label for="estado">Estado</label>
            <select id="estado" name="estado" required>
                <option value="">Carregando estados...</option>
            </select>

            <label for="cidade">Cidade</label>
            <input type="search" id="pesquisaCidade" placeholder="Digite para filtrar as cidades" aria-label="Pesquisar cidade" disabled>

            <select id="cidade" name="cidade" required disabled>
                <option value="">Escolha um estado primeiro</option>
            </select>

            <button type="submit">Inscrever</button>
        </form>

        <p id="qtdCidades" aria-live="polite"></p>
        <p id="mensagemErro" class="erro" role="alert" hidden></p>
        <div id="resumo" role="status"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
